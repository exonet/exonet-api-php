---
name: Sync labels

on:
  workflow_dispatch:
    inputs:
      prune:
        description: Also delete labels that are not in .github/labels.yml.
        type: boolean
        default: false
      dry-run:
        description: Only log what would change, without applying anything.
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - .github/labels.yml

permissions:
  contents: read

jobs:
  labels:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deleting a label also strips it from every issue and PR that has it. The
      # sync therefore only prunes on a manual `prune: true` dispatch.
      - name: Run Label Syncer
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: ${{ !inputs.prune }}
          dry-run: ${{ inputs.dry-run || false }}
